name: APK 64-Bit Donusturucu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Java Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Araclari ve APK Dosyasini Hazirla
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool apksigner
          pip install -q gdown
          gdown 10OiX8sesUO0DPtTSl_VekpuPZRuRN-IJ -O base_32bit.apk

      - name: APK Ac ve Android 16 Uyumlu Yap
        run: |
          apktool d base_32bit.apk -o acilan_apk -f
          sed -i 's/targetSdkVersion: .*/targetSdkVersion: 35/' acilan_apk/apktool.yml
          mkdir -p acilan_apk/lib/arm64-v8a
          cp -r acilan_apk/lib/armeabi-v7a/* acilan_apk/lib/arm64-v8a/ || true

      - name: Yeni APK Paketle ve Imzala
        run: |
          apktool b acilan_apk -o yeni_64bit.apk
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p hazir_apk
          apksigner sign --ks debug.keystore --ks-pass pass:android --out hazir_apk/SpiderMan2_Android16.apk yeni_64bit.apk

      - name: Hazir APK Indirmeye Sun
        uses: actions/upload-artifact@v4
        with:
          name: Android16-Uyumlu-APK
          path: hazir_apk/*.apk
          
